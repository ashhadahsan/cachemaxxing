name: canary
# Nightly live check against the real provider APIs (about $0.02 a run). Runs only from main, never on pull
# requests; the API keys live in the `canary` environment. Dependencies come from uv.lock (hash-pinned and
# reviewed through Dependabot PRs), so no freshly published package ever runs next to the keys.
on:
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live:
    runs-on: ubuntu-latest
    environment: canary
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
      - name: two live turns per provider
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --locked python benchmarks/canary.py
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: {name: canary-report, path: "canary.*", if-no-files-found: ignore}
