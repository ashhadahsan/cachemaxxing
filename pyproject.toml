[project]
name = "cachemaxxing"
version = "0.3.0"
description = "Stop paying full price for the same tokens: measure, diagnose and fix prompt-cache misses on Anthropic, OpenAI, Gemini and LiteLLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashhad Ahsan", email = "ashhadahsan@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["llm", "prompt-caching", "anthropic", "openai", "gemini", "litellm", "cost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.3"]
openai = ["openai>=3.41"]
gemini = ["google-genai>=2.34"]
litellm = ["litellm>=1.106"]  # never 1.82.7/1.82.8 (compromised 2026-03-24)
langchain = ["langchain>=1.4.7"]

[project.urls]
Homepage = "https://ashhadahsan.github.io/cachemaxxing/"
Source = "https://github.com/ashhadahsan/cachemaxxing"
Changelog = "https://github.com/ashhadahsan/cachemaxxing/blob/main/CHANGELOG.md"

[project.scripts]
cachemaxxing = "cachemaxxing.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "anthropic>=2.3",
    "openai>=3.41",
    "google-genai>=2.34",
    "httpx>=0.28",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-anthropic>=1.7.7",
    "langchain-google-genai>=4.4.2",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical==0.0.73",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
exclude = ["docs/*.md"]  # hand-aligned examples and --8<-- snippet includes

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/chart.py" = ["E501"]  # SVG markup lines

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
